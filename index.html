<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>40th Anniversary | Maria & Giacomo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #d4af37;
      --navy: #0f172a;
      --bg: #faf9f6;
      --card-bg: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }

    /* --- INTRO OVERLAY --- */
    #introOverlay {
      position: fixed;
      inset: 0;
      background-color: var(--navy);
      color: white;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      transition: opacity 1s ease, visibility 1s ease;
    }

    #introOverlay.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    .intro-title {
      font-family: 'Cinzel', serif;
      font-size: 2.5rem;
      color: var(--gold);
      margin-bottom: 0.5rem;
    }

    .intro-subtitle {
      font-size: 1.1rem;
      letter-spacing: 2px;
      margin-bottom: 2rem;
      text-transform: uppercase;
      opacity: 0.9;
    }

    .enter-btn {
      background: transparent;
      border: 2px solid var(--gold);
      color: var(--gold);
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      padding: 0.8rem 2rem;
      border-radius: 30px;
      cursor: pointer;
      letter-spacing: 1.5px;
      transition: all 0.3s ease;
    }

    .enter-btn:hover {
      background: var(--gold);
      color: var(--navy);
    }

    /* --- MAIN PAGE CONTENT --- */
    .app-container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 1s ease, transform 1s ease;
    }

    .app-container.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Hero Header */
    .hero-section {
      padding: 2rem 1.5rem 1rem;
      text-align: center;
      background: linear-gradient(180deg, #fff 0%, var(--bg) 100%);
    }

    .hero-badge {
      font-family: 'Cinzel', serif;
      font-size: 1.8rem;
      color: var(--gold);
      margin-bottom: 1rem;
      font-weight: 700;
    }

    /* Hexagon/Card Image Layout */
    .photo-frame-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: -15px;
      margin: 1rem 0;
      position: relative;
    }

    .photo-card {
      width: 140px;
      height: 170px;
      border-radius: 16px;
      overflow: hidden;
      border: 3px solid white;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      background-size: cover;
      background-position: center;
    }

    .photo-card.wedding {
      transform: rotate(-6deg) translateX(10px);
      z-index: 1;
    }

    .photo-card.recent {
      transform: rotate(6deg) translateX(-10px);
      z-index: 2;
    }

    .couple-names {
      font-family: 'Cinzel', serif;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--navy);
      margin-top: 1rem;
      text-transform: uppercase;
    }

    .event-date {
      font-size: 0.9rem;
      letter-spacing: 3px;
      color: var(--muted);
      margin-top: 0.3rem;
      text-transform: uppercase;
    }

    /* Action Buttons */
    .actions-section {
      padding: 1.5rem;
      text-align: center;
    }

    .upload-btn {
      display: block;
      width: 100%;
      background: var(--navy);
      color: white;
      font-family: 'Montserrat', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      padding: 1.1rem;
      border-radius: 14px;
      cursor: pointer;
      border: none;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.25);
    }

    input[type="file"] { display: none; }

    .status-summary {
      margin-top: 1rem;
      font-weight: 600;
      font-size: 0.95rem;
      min-height: 1.2rem;
    }

    /* Live Gallery */
    .gallery-section {
      padding: 1.5rem;
      border-top: 1px solid #f1f5f9;
    }

    .gallery-title {
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      color: var(--navy);
      text-align: center;
      margin-bottom: 1rem;
      letter-spacing: 1px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .grid-item {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      overflow: hidden;
      background: #e2e8f0;
    }

    .grid-item img, .grid-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
    }
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Intro Screen -->
  <div id="introOverlay">
    <div class="intro-title">40th Anniversary</div>
    <div class="intro-subtitle">Maria & Giacomo</div>
    <button class="enter-btn" onclick="enterSite()">Welcome Guests</button>
  </div>

  <!-- Main Application Card -->
  <div class="app-container" id="appContainer">
    
    <!-- Hero Header -->
    <div class="hero-section">
      <div class="hero-badge">40th Anniversary</div>
      
      <div class="photo-frame-container">
        <div class="photo-card wedding" style="background-image: url('hero-wedding.jpg');"></div>
        <div class="photo-card recent" style="background-image: url('hero-recent.jpg');"></div>
      </div>

      <div class="couple-names">Giacomo & Maria</div>
      <div class="event-date">13 Sept, 2026</div>
    </div>

    <!-- Upload Section -->
    <div class="actions-section">
      <label class="upload-btn">
        📷 Share Your Photos
        <input type="file" id="fileInput" accept="image/*,video/*" multiple onchange="uploadFiles(this.files)">
      </label>

      <div id="statusSummary" class="status-summary"></div>
    </div>

    <!-- Shared Party Gallery -->
    <div class="gallery-section">
      <div class="gallery-title">Party Gallery</div>
      <div id="galleryGrid" class="grid"></div>
    </div>

  </div>

  <script>
    // --- CONFIGURATION ---
const CLOUD_NAME = 'kpcloudinary';
const UPLOAD_PRESET = 'MariaGiacomo40th';
const ALBUM_TAG = 'mariagiacomo40'; // Matches your Cloudinary folder tag

// Intro Fade-in logic
function enterSite() {
  const overlay = document.getElementById('introOverlay');
  const app = document.getElementById('appContainer');
  
  overlay.classList.add('fade-out');
  setTimeout(() => {
    app.classList.add('visible');
    loadSharedGallery();
  }, 500);
}

// Fetch and display all photos tagged with 'MariaGiacomo40th'
async function loadSharedGallery() {
  const grid = document.getElementById('galleryGrid');
  grid.innerHTML = '<div style="grid-column: span 3; text-align: center; color: #64748b; padding: 1rem;">Loading album...</div>';

  try {
    // Fetches public resource list for the tag
    const res = await fetch(`https://res.cloudinary.com/${CLOUD_NAME}/image/list/${ALBUM_TAG}.json?nc=${Date.now()}`);
    
    if (!res.ok) {
      grid.innerHTML = '<div style="grid-column: span 3; text-align: center; color: #64748b; padding: 1rem;">No photos uploaded yet. Be the first!</div>';
      return;
    }
    
    const data = await res.json();
    grid.innerHTML = '';

    if (data.resources.length === 0) {
      grid.innerHTML = '<div style="grid-column: span 3; text-align: center; color: #64748b; padding: 1rem;">No photos uploaded yet. Be the first!</div>';
      return;
    }

    data.resources.forEach(item => {
      const card = document.createElement('div');
      card.className = 'grid-item';
      // Deliver optimized webp/jpg thumbnails with auto-quality and cropping
      const imgUrl = `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/c_fill,w_300,h_300,q_auto,f_auto/v${item.version}/${item.public_id}.${item.format}`;
      card.innerHTML = `<img src="${imgUrl}" alt="Party Photo" loading="lazy">`;
      grid.appendChild(card);
    });
  } catch (e) {
    console.error('Gallery error:', e);
    grid.innerHTML = '<div style="grid-column: span 3; text-align: center; color: #64748b; padding: 1rem;">Be the first to share a photo!</div>';
  }
}

// Handle File Uploads
async function uploadFiles(files) {
  if (!files || files.length === 0) return;

  const grid = document.getElementById('galleryGrid');
  const statusSummary = document.getElementById('statusSummary');
  
  // Clear empty state message if present
  if (grid.innerText.includes('No photos') || grid.innerText.includes('Loading')) {
    grid.innerHTML = '';
  }

  statusSummary.innerText = `Uploading 0 of ${files.length}...`;
  let completed = 0;

  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    const formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', UPLOAD_PRESET);
    formData.append('tags', ALBUM_TAG); // Attach tag explicitly on client upload
    formData.append('folder', 'MariaGiacomo40th'); // Put into folder in Cloudinary UI

    // Create temporary preview card
    const tempCard = document.createElement('div');
    tempCard.className = 'grid-item';
    tempCard.innerHTML = `
      <img src="${URL.createObjectURL(file)}">
      <div class="overlay"><div class="spinner"></div></div>
    `;
    grid.prepend(tempCard);

    try {
      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`, {
        method: 'POST',
        body: formData
      });

      if (res.ok) {
        completed++;
        tempCard.querySelector('.overlay').remove();
      } else {
        tempCard.remove();
      }
    } catch (err) {
      tempCard.remove();
    }

    statusSummary.innerText = `Uploading ${completed} of ${files.length}...`;
  }

  statusSummary.innerText = '✅ Photos Shared Successfully!';
  document.getElementById('fileInput').value = '';
  
  // Refresh gallery list after a brief delay to align versions
  setTimeout(loadSharedGallery, 1500);
}
  </script>
</body>
</html>
