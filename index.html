<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share Your Party Photos</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #475569;
      --success: #16a34a;
      --error: #dc2626;
    }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 1.5rem 1rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      padding: 2rem 1.5rem;
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    h1 {
      font-size: 1.75rem;
      margin: 0 0 0.5rem 0;
    }

    p {
      color: var(--text-muted);
      font-size: 1.05rem;
      margin: 0 0 1.5rem 0;
      line-height: 1.4;
    }

    .upload-btn {
      display: inline-block;
      width: 100%;
      background-color: var(--primary);
      color: white;
      font-size: 1.2rem;
      font-weight: 600;
      padding: 1.1rem;
      border-radius: 14px;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .upload-btn:active {
      transform: scale(0.98);
      background-color: var(--primary-hover);
    }

    input[type="file"] {
      display: none;
    }

    .status-summary {
      margin-top: 1.25rem;
      font-weight: 600;
      font-size: 1.05rem;
      min-height: 1.5rem;
    }

    /* Thumbnail Grid */
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 1.5rem;
    }

    .preview-item {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      overflow: hidden;
      background-color: #e2e8f0;
    }

    .preview-item img, .preview-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Status Overlays */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s ease;
    }

    .overlay.success {
      background: rgba(22, 163, 74, 0.3);
    }

    .overlay.error {
      background: rgba(220, 38, 38, 0.5);
    }

    /* Loading Spinner */
    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Status Badges */
    .badge {
      font-size: 1.25rem;
      color: white;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Share Your Party Photos! 📸</h1>
    <p>Tap below to upload photos directly from your phone camera or gallery.</p>

    <label class="upload-btn">
      Select Photos
      <input type="file" id="fileInput" accept="image/*,video/*" multiple onchange="handleFiles(this.files)">
    </label>

    <div id="statusSummary" class="status-summary"></div>
    <div id="previewGrid" class="preview-grid"></div>
  </div>

  <script>
    // Configuration
    const CLOUD_NAME = 'kpcloudinary';
    const UPLOAD_PRESET = 'UnsignedUploads';

    async function handleFiles(files) {
      if (!files || files.length === 0) return;

      const grid = document.getElementById('previewGrid');
      const statusSummary = document.getElementById('statusSummary');

      grid.innerHTML = '';
      statusSummary.style.color = 'var(--text)';
      statusSummary.innerText = `Uploading 0 of ${files.length}...`;

      let completedCount = 0;
      let errorCount = 0;

      // Create preview cards upfront
      const fileTasks = Array.from(files).map((file, index) => {
        const item = document.createElement('div');
        item.className = 'preview-item';

        const isVideo = file.type.startsWith('video/');
        const mediaElem = document.createElement(isVideo ? 'video' : 'img');
        mediaElem.src = URL.revokeObjectURL ? URL.createObjectURL(file) : '';

        const overlay = document.createElement('div');
        overlay.className = 'overlay';
        overlay.id = `overlay-${index}`;
        overlay.innerHTML = `<div class="spinner"></div>`;

        item.appendChild(mediaElem);
        item.appendChild(overlay);
        grid.appendChild(item);

        return { file, index, overlay };
      });

      // Upload sequentially to avoid network congestion on public mobile connections
      for (const task of fileTasks) {
        const formData = new FormData();
        formData.append('file', task.file);
        formData.append('upload_preset', UPLOAD_PRESET);

        try {
          const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`, {
            method: 'POST',
            body: formData
          });

          if (response.ok) {
            completedCount++;
            task.overlay.className = 'overlay success';
            task.overlay.innerHTML = `<span class="badge">✓</span>`;
          } else {
            errorCount++;
            task.overlay.className = 'overlay error';
            task.overlay.innerHTML = `<span class="badge">✕</span>`;
          }
        } catch (err) {
          errorCount++;
          task.overlay.className = 'overlay error';
          task.overlay.innerHTML = `<span class="badge">✕</span>`;
        }

        statusSummary.innerText = `Uploading ${completedCount + errorCount} of ${files.length}...`;
      }

      // Final Status Message
      if (errorCount === 0) {
        statusSummary.style.color = 'var(--success)';
        statusSummary.innerText = '✅ All photos uploaded! Thank you!';
      } else {
        statusSummary.style.color = 'var(--error)';
        statusSummary.innerText = `Uploaded ${completedCount} photos. ${errorCount} failed.`;
      }

      // Reset file input so users can upload another batch if needed
      document.getElementById('fileInput').value = '';
    }
  </script>
</body>
</html>
